<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DEC●PO v0.72 (Mobile Step Edition)</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" sizes="180x180" href="icon.png">

  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #000; color: #00e5ff; font-family: 'Courier New', monospace; }
    body { overflow-x: hidden; -webkit-user-select: none; user-select: none; }
    button, select, input { font-family: inherit; }

    .header {
      position: sticky; top: 0; z-index: 120;
      display: flex; align-items: center; gap: 6px;
      padding: 8px 10px; background: #000; border-bottom: 2px solid #00e5ff;
    }
    .logo { color: #ffea00; font-size: 15px; font-weight: bold; letter-spacing: 2px; white-space: nowrap; }
    .mode-btn, .tiny-btn, .chip, .action-btn {
      background: #000; border: 1px solid #00e5ff55; color: #00e5ff;
      cursor: pointer; font-weight: bold; border-radius: 3px;
      -webkit-tap-highlight-color: transparent;
    }
    .mode-btn { padding: 5px 8px; font-size: 10px; }
    .mode-btn.active { background: #00e5ff; color: #000; border-color: #00e5ff; }
    .play-btn { margin-left: auto; border-color: #ffea00; color: #ffea00; }
    .play-btn.playing { background: #ffea00; color: #000; }
    .bpm-input {
      width: 46px; padding: 4px 3px; text-align: center; font-size: 12px;
      color: #00e5ff; background: #000; border: 1px solid #00e5ff66; border-radius: 3px;
    }

    .file-bar {
      display: flex; gap: 5px; align-items: center; padding: 5px 8px;
      border-bottom: 1px solid #00e5ff33; background: #000; overflow-x: auto;
    }
    .file-bar .mode-btn { white-space: nowrap; padding: 4px 6px; }
    .gm-select-container { margin-left: auto; display: flex; align-items: center; gap: 4px; color: #ffea00; font-size: 9px; white-space: nowrap; }
    .gm-patch-select { max-width: 130px; color: #ffea00; background: #000; border: 1px solid #ffea0066; font-size: 10px; padding: 3px; }
    .gm-patch-select:disabled { color: #555; border-color: #333; }

    .transport-bar {
      display: flex; align-items: center; gap: 4px; padding: 4px 8px;
      border-bottom: 1px solid #00e5ff22; overflow-x: auto; white-space: nowrap;
      font-size: 9px; color: #00e5ff77;
    }
    .transport-bar .mode-btn { padding: 3px 6px; font-size: 9px; border-color: #444; color: #777; }
    .transport-bar .mode-btn.active { color: #ffea00; border-color: #ffea00; background: #ffea0011; }

    .track-bar {
      display: flex; gap: 4px; padding: 5px 8px; overflow-x: auto; white-space: nowrap;
      border-bottom: 1px solid #00e5ff33; -webkit-overflow-scrolling: touch;
    }
    .track-btn { min-width: 42px; padding: 4px 7px; background: #000; color: #00e5ff66; border: 1px solid #00e5ff33; font-size: 10px; font-weight: bold; }
    .track-btn.active { color: #00e5ff; border-color: #00e5ff; background: #00e5ff18; }
    .track-btn.drum-type.active { color: #ffea00; border-color: #ffea00; background: #ffea0018; }

    .pane { display: none; }
    .pane.active { display: block; }

    .step-pane { padding-bottom: max(330px, 52vh); }
    .step-head, .step-row {
      display: grid;
      grid-template-columns: 38px 58px 38px 46px 46px 46px 34px 30px;
      gap: 3px; align-items: center; min-width: 360px;
    }
    .step-head {
      position: sticky; top: 45px; z-index: 50;
      padding: 6px 6px; background: #000; border-bottom: 1px solid #00e5ff55;
      color: #00e5ff77; font-size: 9px;
    }
    .step-row {
      padding: 7px 6px; border-bottom: 1px solid #00e5ff16; font-size: 11px;
      cursor: pointer; min-height: 34px;
    }
    .step-row.current { background: #ffea0016; border-bottom-color: #ffea0077; }
    .step-row.editing { background: #00e5ff13; }
    .step-row .idx { color: #444; font-size: 9px; }
    .step-row .note { font-weight: bold; }
    .step-row .rest { color: #ff7043; }
    .step-row .pc { color: #ffea00; text-align: center; }
    .step-row .dim { color: #00e5ff99; }
    .step-row .chord { color: #ffea00; }
    .row-btn { background: transparent; border: 0; font-size: 16px; line-height: 1; padding: 3px; color: #00e5ff77; }
    .row-btn.del { color: #ff496c88; }
    .empty-state { padding: 28px 16px; text-align: center; color: #00e5ff66; font-size: 11px; line-height: 1.6; }

    .roll-note {
      padding: 5px 8px; color: #00e5ff77; font-size: 9px; line-height: 1.45;
      border-bottom: 1px solid #00e5ff22;
    }
    .roll-container { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .step-header { display: flex; padding-left: 66px; width: max-content; border-bottom: 1px solid #00e5ff22; }
    .roll-step-num { width: 26px; min-width: 26px; padding: 4px 0; text-align: center; font-size: 8px; color: #555; }
    .roll-row { display: flex; width: max-content; border-bottom: 1px solid #111; }
    .roll-label { width: 66px; min-width: 66px; padding: 6px 7px 0 0; text-align: right; color: #00e5ff88; font-size: 9px; border-right: 1px solid #222; }
    .roll-cell { width: 26px; min-width: 26px; height: 24px; border-left: 1px solid #111; }
    .roll-cell.beat { border-left-color: #00e5ff22; }
    .roll-cell.bar { border-left-color: #ffea0044; }
    .roll-cell.on { background: #00e5ff; box-shadow: inset 0 0 0 1px #000; }
    .roll-cell.on.drum { background: #ffea00; }
    .roll-cell.fine { box-shadow: inset 0 0 0 2px #ff496c; }

    .quick-editor {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 200;
      max-height: 48vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
      background: #030303; border-top: 2px solid #00e5ff; box-shadow: 0 -6px 22px #000;
      padding: 7px 8px calc(10px + env(safe-area-inset-bottom));
    }
    .editor-top { display: flex; align-items: center; gap: 5px; margin-bottom: 6px; }
    .edit-badge { color: #ffea00; font-size: 10px; font-weight: bold; min-width: 55px; }
    .tiny-btn { padding: 4px 6px; font-size: 9px; color: #00e5ffbb; }
    .tiny-btn.warn { color: #ff7043; border-color: #ff704366; }
    .editor-section { display: flex; align-items: center; gap: 4px; margin: 5px 0; overflow-x: auto; white-space: nowrap; }
    .section-label { width: 28px; min-width: 28px; color: #00e5ff66; font-size: 9px; }
    .chip { min-width: 34px; padding: 6px 7px; font-size: 10px; color: #00e5ffaa; }
    .chip.active { color: #000; background: #00e5ff; border-color: #00e5ff; }
    .chip.gold.active { color: #000; background: #ffea00; border-color: #ffea00; }
    .chip.gold { color: #ffea00; border-color: #ffea0066; }
    .chip.red { color: #ff7043; border-color: #ff704366; }
    .chip.wide { min-width: 54px; }
    .chip.small { padding: 5px 6px; min-width: 31px; }
    .custom-input {
      width: 48px; padding: 5px 3px; text-align: center; font-size: 10px;
      color: #00e5ff; background: #000; border: 1px solid #00e5ff44; border-radius: 3px;
    }
    .pc-inline { max-width: 116px; padding: 4px; background: #000; color: #ffea00; border: 1px solid #ffea0044; font-size: 9px; }
    .advanced-row { display: flex; gap: 8px; align-items: center; padding-top: 4px; border-top: 1px solid #00e5ff16; }
    .advanced-group { display: flex; align-items: center; gap: 3px; font-size: 9px; color: #00e5ff66; }
    .action-row { display: grid; grid-template-columns: 1fr 86px; gap: 6px; margin-top: 7px; }
    .action-btn { padding: 9px 10px; font-size: 12px; border-color: #ffea00; color: #ffea00; }
    .action-btn.primary { background: #ffea00; color: #000; }
    .action-btn.secondary { border-color: #00e5ff77; color: #00e5ff; }

    @media (min-width: 720px) {
      .step-pane { padding-bottom: 265px; }
      .quick-editor { max-height: 40vh; }
      .step-head, .step-row { grid-template-columns: 48px 70px 48px 58px 58px 58px 42px 34px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">DEC●PO</span>
    <button id="btn-step" class="mode-btn active" onclick="switchPane('step')">STEP</button>
    <button id="btn-roll" class="mode-btn" onclick="switchPane('roll')">ROLL</button>
    <span style="color:#00e5ff66;font-size:9px;margin-left:2px;">BPM</span>
    <input type="number" id="bpm-val" class="bpm-input" value="120" inputmode="numeric" min="20" max="300" onchange="updateBpm()">
    <button id="btn-play" class="mode-btn play-btn" onclick="togglePlay()">▶ PLAY</button>
  </div>

  <div class="file-bar">
    <button class="mode-btn" style="border-color:#ffea00;color:#ffea00" onclick="saveToFile()">💾 JSON</button>
    <button class="mode-btn" onclick="exportMidiFile()">🎹 MIDI</button>
    <button class="mode-btn" style="border-color:#ff7043;color:#ff7043" onclick="triggerLoad()">📂 LOAD</button>
    <input type="file" id="file-loader" accept=".json" style="display:none" onchange="loadFile(event)">
    <div class="gm-select-container">
      <span>GM</span><select id="gm-pc-select" class="gm-patch-select" onchange="updateTrackGmPatch(this.value)"></select>
    </div>
  </div>

  <div class="transport-bar">
    <span>PLAY</span>
    <button id="play-all" class="mode-btn active" onclick="setPlayMode('all')">ALL</button>
    <button id="play-solo" class="mode-btn" onclick="setPlayMode('solo')">SOLO</button>
    <span style="margin-left:5px">RANGE</span>
    <button id="range-full" class="mode-btn active" onclick="setPlayRange('full')">FULL</button>
    <button id="range-bar" class="mode-btn" onclick="setPlayRange('bar')">1 BAR</button>
    <button class="mode-btn" style="margin-left:auto" onclick="undoLast()">↶ UNDO</button>
  </div>

  <div class="track-bar" id="track-bar-content"></div>

  <section id="pane-step" class="pane step-pane active">
    <div class="step-head">
      <div>POS</div><div>NOTE</div><div>PC</div><div>ST</div><div>GT</div><div>VEL</div><div>+</div><div>×</div>
    </div>
    <div id="step-rows-content"></div>
  </section>

  <section id="pane-roll" class="pane">
    <div class="roll-note">ROLLは24クロック単位の読み取り専用プレビューです。細分STは赤枠で近似表示し、曲データの正本はSTEP側です。</div>
    <div class="roll-container">
      <div class="step-header" id="roll-header-content"></div>
      <div id="roll-grid-content"></div>
    </div>
  </section>

  <div id="quick-editor" class="quick-editor">
    <div class="editor-top">
      <span id="edit-badge" class="edit-badge">ADD</span>
      <button class="tiny-btn" onclick="copyPreviousToForm()">COPY LAST</button>
      <button class="tiny-btn" onclick="setRestForm()">REST</button>
      <button class="tiny-btn" onclick="setChordForm()">CHORD ST0</button>
      <button class="tiny-btn warn" style="margin-left:auto" onclick="cancelEdit()">CLEAR</button>
    </div>

    <div id="note-controls" class="editor-section">
      <span class="section-label">NOTE</span>
      <div id="pitch-buttons" style="display:flex;gap:3px"></div>
    </div>
    <div id="octave-controls" class="editor-section">
      <span class="section-label">OCT</span>
      <button class="chip small" data-oct="3" onclick="setOctave(3)">3</button>
      <button class="chip small" data-oct="4" onclick="setOctave(4)">4</button>
      <button class="chip small" data-oct="5" onclick="setOctave(5)">5</button>
      <button class="chip red wide" onclick="setRestForm()">REST</button>
    </div>
    <div id="drum-controls" class="editor-section" style="display:none">
      <span class="section-label">DRUM</span>
      <button class="chip gold" data-drum="BD" onclick="setDrum('BD')">BD</button>
      <button class="chip gold" data-drum="SD" onclick="setDrum('SD')">SD</button>
      <button class="chip gold" data-drum="CH" onclick="setDrum('CH')">CH</button>
      <button class="chip gold" data-drum="OH" onclick="setDrum('OH')">OH</button>
      <button class="chip red wide" onclick="setRestForm()">REST</button>
    </div>

    <div class="editor-section">
      <span class="section-label">ST</span>
      <button class="chip" data-st="0" onclick="setSt(0)">0</button>
      <button class="chip" data-st="24" onclick="setSt(24)">24</button>
      <button class="chip" data-st="48" onclick="setSt(48)">48</button>
      <button class="chip" data-st="96" onclick="setSt(96)">96</button>
      <button class="chip" data-st="192" onclick="setSt(192)">192</button>
      <button class="chip" data-st="384" onclick="setSt(384)">384</button>
    </div>
    <div class="editor-section">
      <span class="section-label">FINE</span>
      <button class="chip small" data-st="6" onclick="setSt(6)">6</button>
      <button class="chip small" data-st="12" onclick="setSt(12)">12</button>
      <button class="chip small" data-st="16" onclick="setSt(16)">16</button>
      <button class="chip small" data-st="18" onclick="setSt(18)">18</button>
      <button class="chip small" data-st="32" onclick="setSt(32)">32</button>
      <button class="chip small" data-st="36" onclick="setSt(36)">36</button>
      <button class="chip small" data-st="64" onclick="setSt(64)">64</button>
      <button class="chip small" data-st="72" onclick="setSt(72)">72</button>
      <button class="chip small" data-st="144" onclick="setSt(144)">144</button>
    </div>

    <div class="editor-section">
      <span class="section-label">GT</span>
      <button class="chip" onclick="setGtRatio(0.50)">50%</button>
      <button class="chip" onclick="setGtRatio(0.75)">75%</button>
      <button class="chip" onclick="setGtRatio(0.90)">90%</button>
      <button class="chip" onclick="setGtRatio(1.00)">100%</button>
      <input id="gt-input" class="custom-input" type="number" inputmode="numeric" min="0" value="72" onchange="setGtCustom(this.value)">
    </div>

    <div class="editor-section">
      <span class="section-label">VEL</span>
      <button class="chip" data-vel="64" onclick="setVel(64)">64</button>
      <button class="chip" data-vel="80" onclick="setVel(80)">80</button>
      <button class="chip" data-vel="100" onclick="setVel(100)">100</button>
      <button class="chip" data-vel="112" onclick="setVel(112)">112</button>
      <button class="chip" data-vel="127" onclick="setVel(127)">127</button>
    </div>

    <div class="advanced-row">
      <div class="advanced-group">ST <input id="st-input" class="custom-input" type="number" inputmode="numeric" min="0" value="96" onchange="setSt(this.value)"></div>
      <div class="advanced-group">VEL <input id="vel-input" class="custom-input" type="number" inputmode="numeric" min="0" max="127" value="100" onchange="setVel(this.value)"></div>
      <div class="advanced-group">PC <select id="row-pc-select" class="pc-inline" onchange="setRowPc(this.value)"></select></div>
    </div>

    <div class="action-row">
      <button id="commit-btn" class="action-btn primary" onclick="commitQuickEdit()">＋ ADD</button>
      <button class="action-btn secondary" onclick="addRestQuick()">＋ REST</button>
    </div>
  </div>

  <script>
    const VERSION = 'v0.72';
    const CLOCKS_PER_QUARTER = 96;
    const ROLL_STEP = 24;
    const PITCH_CLASSES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
    const BLACK_NOTES = ['C#','D#','F#','G#','A#'];
    const DRUM_TYPES = ['BD','SD','CH','OH'];
    const ALL_NOTES = [];
    for (let oct = 3; oct <= 5; oct++) PITCH_CLASSES.forEach(n => ALL_NOTES.push(n + oct));

    const GM_LABELS = {
      1:'1:Piano', 2:'2:Bright Pno', 5:'5:Tine E.Pno', 17:'17:Drawbar Org', 25:'25:Steel Gtr',
      33:'33:Finger Bass', 36:'36:Fretless Bass', 41:'41:Violin', 49:'49:Strings 1', 53:'53:Choir Aahs',
      57:'57:Trumpet', 61:'61:Brass Sect', 66:'66:Alto Sax', 74:'74:Flute', 81:'81:Square Lead',
      82:'82:Saw Lead', 89:'89:Pad 1(Warm)', 105:'105:Sitar'
    };

    const TRACKS = Array(16).fill(null).map((_, i) => {
      let pc = 1;
      if (i === 2) pc = 33;
      if (i === 3) pc = 49;
      if (i === 5) pc = 57;
      if (i === 7) pc = 74;
      if (i === 11) pc = 89;
      return { name:`CH${i + 1}`, type:(i === 9 ? 'drum' : 'synth'), pc, initPc:pc };
    });

    let stgtTracksData = Array(16).fill(null).map(() => []); // v0.72の正本
    let currentTrackIdx = 0;
    let currentPane = 'step';
    let currentEditIdx = null;
    let currentForm = { note:'C4', st:96, gt:72, vel:100, pc:0 };
    let currentPitchClass = 'C';
    let currentOctave = 4;
    let undoStack = [];

    let audioCtx = null;
    let noiseBuffer = null;
    let isPlaying = false;
    let playMode = 'all';
    let playRange = 'full';
    let stgtIndices = Array(16).fill(0);
    let stgtTimerIds = Array(16).fill(null);
    let stgtAccumSt = Array(16).fill(0);
    let stgtLastPlayedIndex = Array(16).fill(-1);

    function sanitizeNonNegativeClock(raw, fallback = 0) {
      const n = Number(raw);
      return Number.isFinite(n) ? Math.max(0, Math.round(n)) : Math.max(0, Math.round(Number(fallback) || 0));
    }
    function sanitizeVelocity(raw, fallback = 100) {
      const n = Number(raw);
      const safe = Number.isFinite(n) ? Math.round(n) : Math.round(Number(fallback) || 100);
      return Math.max(0, Math.min(127, safe));
    }
    function sanitizePc(raw) {
      const n = Number(raw);
      return Number.isFinite(n) ? Math.max(0, Math.min(128, Math.round(n))) : 0;
    }
    function sanitizeBpm(raw) {
      const n = Number(raw);
      return Number.isFinite(n) ? Math.max(20, Math.min(300, Math.round(n))) : 120;
    }
    function cloneTracksData() { return stgtTracksData.map(track => track.map(row => ({...row}))); }
    function pushUndo() {
      undoStack.push(cloneTracksData());
      if (undoStack.length > 30) undoStack.shift();
    }
    function undoLast() {
      if (!undoStack.length) return;
      stgtTracksData = undoStack.pop();
      currentEditIdx = null;
      renderAll();
    }

    function buildGmOptions(select, includeNone = false) {
      let html = includeNone ? '<option value="0">--</option>' : '';
      Object.keys(GM_LABELS).forEach(k => { html += `<option value="${k}">${GM_LABELS[k]}</option>`; });
      select.innerHTML = html;
    }
    function buildPitchButtons() {
      const box = document.getElementById('pitch-buttons');
      box.innerHTML = PITCH_CLASSES.map(p => `<button class="chip ${BLACK_NOTES.includes(p) ? 'gold' : ''}" data-pitch="${p}" onclick="setPitch('${p}')">${p}</button>`).join('');
    }
    function buildTrackBar() {
      const bar = document.getElementById('track-bar-content');
      bar.innerHTML = TRACKS.map((t, i) => `<button class="track-btn ${t.type === 'drum' ? 'drum-type' : ''} ${i === currentTrackIdx ? 'active' : ''}" onclick="switchTrack(${i})">${t.name}</button>`).join('');
    }
    function updateTrackGmPatch(value) {
      if (TRACKS[currentTrackIdx].type === 'drum') return;
      const pc = sanitizePc(value) || 1;
      TRACKS[currentTrackIdx].initPc = pc;
      TRACKS[currentTrackIdx].pc = pc;
    }
    function switchTrack(idx) {
      currentTrackIdx = idx;
      currentEditIdx = null;
      const gm = document.getElementById('gm-pc-select');
      if (TRACKS[idx].type === 'drum') {
        gm.innerHTML = '<option value="10">10:GM Drumset</option>';
        gm.disabled = true;
        currentForm.note = DRUM_TYPES.includes(currentForm.note) ? currentForm.note : 'BD';
      } else {
        buildGmOptions(gm, false);
        gm.value = TRACKS[idx].initPc;
        gm.disabled = false;
        if (!ALL_NOTES.includes(currentForm.note)) currentForm.note = 'C4';
      }
      buildTrackBar();
      syncEditorFromForm();
      renderAll();
    }

    function switchPane(pane) {
      currentPane = pane;
      document.getElementById('btn-step').classList.toggle('active', pane === 'step');
      document.getElementById('btn-roll').classList.toggle('active', pane === 'roll');
      document.getElementById('pane-step').classList.toggle('active', pane === 'step');
      document.getElementById('pane-roll').classList.toggle('active', pane === 'roll');
      document.getElementById('quick-editor').style.display = pane === 'step' ? 'block' : 'none';
      if (pane === 'roll') renderRollPreview();
    }
    function setPlayMode(mode) {
      playMode = mode;
      document.getElementById('play-all').classList.toggle('active', mode === 'all');
      document.getElementById('play-solo').classList.toggle('active', mode === 'solo');
      restartIfPlaying();
    }
    function setPlayRange(range) {
      playRange = range;
      document.getElementById('range-full').classList.toggle('active', range === 'full');
      document.getElementById('range-bar').classList.toggle('active', range === 'bar');
      restartIfPlaying();
    }
    function restartIfPlaying() { if (isPlaying) { stopPlayback(); startPlayback(); } }

    function formatPosition(clock) {
      const bar = Math.floor(clock / 384) + 1;
      const within = clock % 384;
      const beat = Math.floor(within / 96) + 1;
      const tick = within % 96;
      return `${bar}.${beat}.${String(tick).padStart(2,'0')}`;
    }
    function renderStepTable() {
      const data = stgtTracksData[currentTrackIdx] || [];
      const box = document.getElementById('step-rows-content');
      if (!data.length) {
        box.innerHTML = '<div class="empty-state">下のパネルで音を選び、ADD。<br>STEPが曲データの正本です。</div>';
        return;
      }
      let clock = 0;
      box.innerHTML = data.map((row, i) => {
        const pos = formatPosition(clock);
        const isCurrent = isPlaying && stgtLastPlayedIndex[currentTrackIdx] === i;
        const isEditing = currentEditIdx === i;
        const noteClass = row.note === 'REST' ? 'rest' : 'note';
        const stClass = Number(row.st) === 0 ? 'chord' : 'dim';
        const html = `<div class="step-row ${isCurrent ? 'current' : ''} ${isEditing ? 'editing' : ''}" onclick="editRow(${i})">
          <div class="idx">${pos}</div>
          <div class="${noteClass}">${row.note}</div>
          <div class="pc">${row.pc > 0 ? row.pc : '-'}</div>
          <div class="${stClass}">${row.st}</div>
          <div class="dim">${row.gt}</div>
          <div class="dim">${row.vel}</div>
          <button class="row-btn" onclick="event.stopPropagation(); insertAfter(${i})">＋</button>
          <button class="row-btn del" onclick="event.stopPropagation(); deleteRow(${i})">×</button>
        </div>`;
        clock += sanitizeNonNegativeClock(row.st, 0);
        return html;
      }).join('');
    }

    function getTrackEventsForRoll(tIdx) {
      const result = [];
      let clock = 0;
      (stgtTracksData[tIdx] || []).forEach(row => {
        if (row.note && row.note !== 'REST') result.push({ note:row.note, clock, fine:(clock % ROLL_STEP) !== 0 });
        clock += sanitizeNonNegativeClock(row.st, 0);
      });
      return { events:result, duration:clock };
    }
    function renderRollPreview() {
      const header = document.getElementById('roll-header-content');
      const grid = document.getElementById('roll-grid-content');
      const {events, duration} = getTrackEventsForRoll(currentTrackIdx);
      const maxEventClock = events.reduce((m,e) => Math.max(m,e.clock), 0);
      const totalSteps = Math.max(16, Math.ceil((Math.max(duration, maxEventClock + 24)) / ROLL_STEP / 16) * 16);
      header.innerHTML = Array(totalSteps).fill(0).map((_,i) => `<div class="roll-step-num">${i + 1}</div>`).join('');
      const byNote = new Map();
      events.forEach(ev => {
        const key = ev.note;
        if (!byNote.has(key)) byNote.set(key, new Map());
        const step = Math.floor(ev.clock / ROLL_STEP);
        byNote.get(key).set(step, ev);
      });

      const isDrum = TRACKS[currentTrackIdx].type === 'drum';
      const labels = isDrum ? DRUM_TYPES : [...ALL_NOTES].reverse();
      grid.innerHTML = labels.map(label => {
        const map = byNote.get(label) || new Map();
        const cells = Array(totalSteps).fill(0).map((_,step) => {
          const ev = map.get(step);
          const classes = ['roll-cell'];
          if (step % 16 === 0) classes.push('bar'); else if (step % 4 === 0) classes.push('beat');
          if (ev) { classes.push('on'); if (isDrum) classes.push('drum'); if (ev.fine) classes.push('fine'); }
          return `<div class="${classes.join(' ')}"></div>`;
        }).join('');
        return `<div class="roll-row"><div class="roll-label">${label}</div>${cells}</div>`;
      }).join('');
    }

    function setPitch(pitch) {
      const wasRest = currentForm.note === 'REST';
      currentPitchClass = pitch;
      currentForm.note = `${pitch}${currentOctave}`;
      if (wasRest) {
        currentForm.vel = 100;
        currentForm.gt = currentForm.st > 0 ? Math.max(1, Math.round(currentForm.st * 0.75)) : 72;
      }
      syncEditorFromForm();
    }
    function setOctave(oct) {
      currentOctave = Number(oct);
      if (PITCH_CLASSES.includes(currentPitchClass)) currentForm.note = `${currentPitchClass}${currentOctave}`;
      updateEditorSelection();
    }
    function setDrum(drum) {
      const wasRest = currentForm.note === 'REST';
      currentForm.note = drum;
      if (wasRest) {
        currentForm.vel = 100;
        currentForm.gt = currentForm.st > 0 ? Math.max(1, Math.round(currentForm.st * 0.5)) : 12;
      }
      syncEditorFromForm();
    }
    function setRestForm() {
      currentForm.note = 'REST';
      currentForm.gt = 0;
      currentForm.vel = 0;
      syncEditorFromForm();
    }
    function setChordForm() { setSt(0); }
    function setSt(raw) {
      currentForm.st = sanitizeNonNegativeClock(raw, currentForm.st);
      if (currentForm.st > 0 && currentForm.note !== 'REST') currentForm.gt = Math.max(1, Math.round(currentForm.st * 0.75));
      if (currentForm.note === 'REST') currentForm.gt = 0;
      syncEditorFromForm();
    }
    function setGtRatio(ratio) {
      if (currentForm.note === 'REST') { currentForm.gt = 0; }
      else if (currentForm.st > 0) { currentForm.gt = Math.max(1, Math.round(currentForm.st * Number(ratio))); }
      syncEditorFromForm();
    }
    function setGtCustom(raw) { currentForm.gt = sanitizeNonNegativeClock(raw, currentForm.gt); syncEditorFromForm(); }
    function setVel(raw) { currentForm.vel = sanitizeVelocity(raw, currentForm.vel); syncEditorFromForm(); }
    function setRowPc(raw) { currentForm.pc = sanitizePc(raw); syncEditorFromForm(); }

    function updateEditorSelection() {
      document.querySelectorAll('[data-pitch]').forEach(b => b.classList.toggle('active', currentForm.note !== 'REST' && currentForm.note.startsWith(b.dataset.pitch) && String(currentForm.note).slice(0,-1) === b.dataset.pitch));
      document.querySelectorAll('[data-oct]').forEach(b => b.classList.toggle('active', currentForm.note !== 'REST' && Number(String(currentForm.note).slice(-1)) === Number(b.dataset.oct)));
      document.querySelectorAll('[data-drum]').forEach(b => b.classList.toggle('active', currentForm.note === b.dataset.drum));
      document.querySelectorAll('[data-st]').forEach(b => b.classList.toggle('active', Number(b.dataset.st) === Number(currentForm.st)));
      document.querySelectorAll('[data-vel]').forEach(b => b.classList.toggle('active', Number(b.dataset.vel) === Number(currentForm.vel)));
    }
    function syncEditorFromForm() {
      const isDrum = TRACKS[currentTrackIdx].type === 'drum';
      document.getElementById('note-controls').style.display = isDrum ? 'none' : 'flex';
      document.getElementById('octave-controls').style.display = isDrum ? 'none' : 'flex';
      document.getElementById('drum-controls').style.display = isDrum ? 'flex' : 'none';

      if (!isDrum && ALL_NOTES.includes(currentForm.note)) {
        const match = currentForm.note.match(/^([A-G]#?)([3-5])$/);
        if (match) { currentPitchClass = match[1]; currentOctave = Number(match[2]); }
      }
      if (isDrum && !DRUM_TYPES.includes(currentForm.note) && currentForm.note !== 'REST') currentForm.note = 'BD';

      currentForm.st = sanitizeNonNegativeClock(currentForm.st, 96);
      currentForm.gt = sanitizeNonNegativeClock(currentForm.gt, 72);
      currentForm.vel = sanitizeVelocity(currentForm.vel, 100);
      currentForm.pc = sanitizePc(currentForm.pc);

      document.getElementById('st-input').value = currentForm.st;

      document.getElementById('vel-input').value = currentForm.vel;
      document.getElementById('row-pc-select').value = currentForm.pc;
      document.getElementById('edit-badge').textContent = currentEditIdx === null ? 'ADD' : `EDIT #${currentEditIdx + 1}`;
      document.getElementById('commit-btn').textContent = currentEditIdx === null ? '＋ ADD' : '✓ UPDATE';
      updateEditorSelection();
    }

    function normalizeRow(row, tIdx) {
      const isDrum = TRACKS[tIdx].type === 'drum';
      let note = String(row && row.note ? row.note : (isDrum ? 'BD' : 'C4'));
      if (note !== 'REST') {
        if (isDrum && !DRUM_TYPES.includes(note)) note = 'BD';
        if (!isDrum && !ALL_NOTES.includes(note)) note = 'C4';
      }
      const normalized = {
        note,
        st:sanitizeNonNegativeClock(row && row.st, 96),
        gt:sanitizeNonNegativeClock(row && row.gt, 72),
        vel:sanitizeVelocity(row && row.vel, 100),
        pc:sanitizePc(row && row.pc)
      };
      if (note === 'REST') { normalized.gt = 0; normalized.vel = 0; normalized.pc = 0; }
      return normalized;
    }
    function editRow(idx) {
      const row = stgtTracksData[currentTrackIdx][idx];
      if (!row) return;
      currentEditIdx = idx;
      currentForm = {...row};
      syncEditorFromForm();
      renderStepTable();
    }
    function cancelEdit() {
      currentEditIdx = null;
      const isDrum = TRACKS[currentTrackIdx].type === 'drum';
      currentForm = { note:isDrum ? 'BD' : 'C4', st:96, gt:72, vel:100, pc:0 };
      syncEditorFromForm();
      renderStepTable();
    }
    function copyPreviousToForm() {
      const data = stgtTracksData[currentTrackIdx];
      if (!data.length) return;
      const sourceIndex = currentEditIdx === null ? data.length - 1 : Math.max(0, currentEditIdx - 1);
      currentForm = {...data[sourceIndex], pc:0};
      if (currentEditIdx !== null) currentEditIdx = null;
      syncEditorFromForm();
      renderStepTable();
    }
    function commitQuickEdit() {
      const data = stgtTracksData[currentTrackIdx];
      pushUndo();
      const row = normalizeRow(currentForm, currentTrackIdx);
      if (currentEditIdx === null) data.push(row); else data[currentEditIdx] = row;
      currentEditIdx = null;
      currentForm = {...row, pc:0};
      if (row.note === 'REST') {
        currentForm.note = TRACKS[currentTrackIdx].type === 'drum' ? 'BD' : 'C4';
        currentForm.gt = Math.max(1, Math.round(Math.max(24, row.st) * 0.75));
        currentForm.vel = 100;
      }
      syncEditorFromForm();
      renderAll();
      requestAnimationFrame(() => window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'}));
    }
    function addRestQuick() {
      pushUndo();
      const data = stgtTracksData[currentTrackIdx];
      data.push({note:'REST', st:Math.max(1, sanitizeNonNegativeClock(currentForm.st, 96)), gt:0, vel:0, pc:0});
      currentEditIdx = null;
      renderAll();
    }
    function deleteRow(idx) {
      const data = stgtTracksData[currentTrackIdx];
      if (!data[idx]) return;
      pushUndo();
      data.splice(idx, 1);
      currentEditIdx = null;
      renderAll();
    }
    function insertAfter(idx) {
      const data = stgtTracksData[currentTrackIdx];
      pushUndo();
      const base = data[idx] ? {...data[idx], pc:0} : normalizeRow(currentForm, currentTrackIdx);
      data.splice(idx + 1, 0, base);
      currentEditIdx = idx + 1;
      currentForm = {...base};
      syncEditorFromForm();
      renderAll();
    }

    function renderAll() {
      renderStepTable();
      if (currentPane === 'roll') renderRollPreview();
    }

    function noteToMidi(note) {
      const match = String(note).match(/^([A-G]#?)(\d)$/);
      if (!match) return 60;
      return 12 * (Number(match[2]) + 1) + PITCH_CLASSES.indexOf(match[1]);
    }
    function noteToFreq(note) {
      const midi = noteToMidi(note);
      return 440 * Math.pow(2, (midi - 69) / 12);
    }
    function velocityGain(velocity) { return Math.max(0, Math.min(1.27, sanitizeVelocity(velocity,100) / 100)); }

    function playToneWithGm(note, trackIdx, duration, velocity = 100) {
      if (!audioCtx || velocity <= 0) return;
      const now = audioCtx.currentTime;
      let freq = noteToFreq(note);
      const pc = TRACKS[trackIdx].pc;
      if (pc >= 33 && pc <= 40) freq /= 2;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const vg = velocityGain(velocity);
      if (pc >= 1 && pc <= 8) osc.type = 'sine';
      else if (pc >= 25 && pc <= 32) osc.type = 'sawtooth';
      else if (pc >= 33 && pc <= 40) osc.type = 'triangle';
      else if (pc >= 41 && pc <= 56) osc.type = 'sawtooth';
      else if (pc >= 57 && pc <= 64) osc.type = 'square';
      else osc.type = 'square';
      osc.frequency.value = freq;
      if (pc >= 1 && pc <= 8) {
        gain.gain.setValueAtTime(0.25 * vg, now);
        gain.gain.linearRampToValueAtTime(0.001, now + duration);
      } else if (pc >= 41 && pc <= 56) {
        const attack = Math.min(0.12, duration * 0.3);
        gain.gain.setValueAtTime(0.0, now);
        gain.gain.linearRampToValueAtTime(0.22 * vg, now + attack);
        gain.gain.setValueAtTime(0.22 * vg, now + Math.max(attack, duration - 0.05));
        gain.gain.linearRampToValueAtTime(0.001, now + duration);
      } else if (pc >= 33 && pc <= 40) {
        gain.gain.setValueAtTime(0.3 * vg, now);
        gain.gain.linearRampToValueAtTime(0.05 * vg, now + duration);
      } else {
        gain.gain.setValueAtTime(0.18 * vg, now);
        gain.gain.linearRampToValueAtTime(0.001, now + duration);
      }
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + Math.max(0.01,duration) + 0.05);
    }
    function playDrum(type, duration = 0.15, velocity = 100) {
      if (!audioCtx || velocity <= 0) return;
      const now = audioCtx.currentTime;
      const vg = velocityGain(velocity);
      if (!noiseBuffer) {
        const size = Math.floor(audioCtx.sampleRate * 0.4);
        noiseBuffer = audioCtx.createBuffer(1, size, audioCtx.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        for (let i = 0; i < size; i++) data[i] = Math.random() * 2 - 1;
      }
      if (type === 'BD') {
        const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(140, now); osc.frequency.exponentialRampToValueAtTime(0.01, now + 0.12);
        gain.gain.setValueAtTime(0.6 * vg, now); gain.gain.linearRampToValueAtTime(0.001, now + 0.14);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.15);
      } else {
        const source = audioCtx.createBufferSource(); source.buffer = noiseBuffer;
        const gain = audioCtx.createGain(); let d = duration;
        if (type === 'CH') { gain.gain.setValueAtTime(0.22 * vg, now); d = 0.03; }
        else if (type === 'OH') { gain.gain.setValueAtTime(0.20 * vg, now); d = Math.max(0.2, duration); }
        else { gain.gain.setValueAtTime(0.30 * vg, now); d = 0.18; }
        gain.gain.linearRampToValueAtTime(0.001, now + d);
        source.connect(gain); gain.connect(audioCtx.destination); source.start(now); source.stop(now + d + 0.01);
      }
    }

    function getTrackDurationClock(t) {
      return (stgtTracksData[t] || []).reduce((sum,row) => sum + sanitizeNonNegativeClock(row.st,0), 0);
    }
    function getGlobalDurationClock() {
      let max = 0;
      for (let t=0; t<16; t++) max = Math.max(max, getTrackDurationClock(t));
      return Math.max(96, max);
    }

    function resetTrackPc(t) {
      TRACKS[t].pc = TRACKS[t].initPc;
      if (t === currentTrackIdx && TRACKS[t].type !== 'drum') document.getElementById('gm-pc-select').value = TRACKS[t].initPc;
    }
    function startPlayback() {
      if (audioCtx) { try { audioCtx.close(); } catch(e) {} }
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      noiseBuffer = null;
      try {
        const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.0001, audioCtx.currentTime); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.001);
      } catch(e) {}
      TRACKS.forEach((_,i) => resetTrackPc(i));
      stgtIndices.fill(0); stgtAccumSt.fill(0); stgtLastPlayedIndex.fill(-1);
      isPlaying = true;
      const btn = document.getElementById('btn-play'); btn.textContent = '■ STOP'; btn.classList.add('playing');
      if (playMode === 'solo') runTrackSequencer(currentTrackIdx); else for (let t = 0; t < 16; t++) runTrackSequencer(t);
      renderStepTable();
    }
    function stopPlayback() {
      isPlaying = false;
      stgtTimerIds.forEach(id => { if (id) clearTimeout(id); }); stgtTimerIds.fill(null);
      stgtLastPlayedIndex.fill(-1);
      if (audioCtx) { try { audioCtx.close(); } catch(e) {} audioCtx = null; }
      TRACKS.forEach((_,i) => resetTrackPc(i));
      const btn = document.getElementById('btn-play'); btn.textContent = '▶ PLAY'; btn.classList.remove('playing');
      renderStepTable();
    }
    function togglePlay() { if (isPlaying) stopPlayback(); else startPlayback(); }
    function runTrackSequencer(t) {
      const data = stgtTracksData[t] || [];
      if (!data.length) return;
      const step = () => {
        if (!isPlaying) return;
        const bpm = sanitizeBpm(document.getElementById('bpm-val').value);
        const unitTime = (60 / bpm) / CLOCKS_PER_QUARTER;
        let idx = stgtIndices[t];
        let delayClocks = 0;
        let guard = 0;
        if (idx === 0) resetTrackPc(t);

        while (isPlaying && guard++ < 128) {
          if (idx >= data.length) idx = 0;
          const row = data[idx];
          if (!row) break;
          stgtLastPlayedIndex[t] = idx;

          if (row.pc > 0 && TRACKS[t].type !== 'drum') TRACKS[t].pc = row.pc;
          if (row.note && row.note !== 'REST') {
            const duration = Math.max(0.01, sanitizeNonNegativeClock(row.gt,0) * unitTime);
            if (TRACKS[t].type === 'drum') playDrum(row.note, duration, row.vel);
            else playToneWithGm(row.note, t, duration, row.vel);
          }

          const st = sanitizeNonNegativeClock(row.st,0);
          const endReached = idx + 1 >= data.length;
          let nextIdx = endReached ? 0 : idx + 1;

          if (playRange === 'bar') {
            const remain = Math.max(0, 384 - stgtAccumSt[t]);
            if (st > 0 && st >= remain && remain > 0) {
              delayClocks += remain;
              stgtAccumSt[t] = 0;
              nextIdx = 0;
              idx = nextIdx;
              break;
            }
            delayClocks += st;
            stgtAccumSt[t] += st;
            if (endReached) {
              const pad = Math.max(0, 384 - stgtAccumSt[t]);
              delayClocks += pad;
              stgtAccumSt[t] = 0;
              nextIdx = 0;
              idx = nextIdx;
              break;
            }
          } else {
            delayClocks += st;
            if (endReached) {
              const pad = Math.max(0, getGlobalDurationClock() - getTrackDurationClock(t));
              delayClocks += pad;
              nextIdx = 0;
              idx = nextIdx;
              break;
            }
          }

          idx = nextIdx;
          if (st > 0) break;
          if (idx === 0 && delayClocks === 0) break;
        }

        stgtIndices[t] = idx;
        if (t === currentTrackIdx && currentPane === 'step') renderStepTable();
        const delayMs = delayClocks * unitTime * 1000;
        stgtTimerIds[t] = setTimeout(step, Math.max(10, delayMs || 50));
      };
      step();
    }

    function updateBpm() {
      const input = document.getElementById('bpm-val');
      input.value = sanitizeBpm(input.value);
      restartIfPlaying();
    }

    function toVLQ(num) {
      let n = Math.max(0, Math.round(num));
      const out = [n & 0x7F]; n >>>= 7;
      while (n > 0) { out.push((n & 0x7F) | 0x80); n >>>= 7; }
      return out.reverse();
    }
    function exportMidiFile() {
      const header = [0x4D,0x54,0x68,0x64,0,0,0,6,0,0,0,1,0,0x60];
      const events = [];
      for (let t = 0; t < 16; t++) {
        if (TRACKS[t].type !== 'drum') events.push({time:0, bytes:[0xC0 + t, TRACKS[t].initPc - 1], priority:0});
        let clock = 0;
        (stgtTracksData[t] || []).forEach(row => {
          if (TRACKS[t].type !== 'drum' && row.pc > 0) events.push({time:clock, bytes:[0xC0 + t, row.pc - 1], priority:0});
          if (row.note && row.note !== 'REST') {
            const vel = sanitizeVelocity(row.vel,100);
            const gt = sanitizeNonNegativeClock(row.gt,0);
            if (TRACKS[t].type === 'drum') {
              const map = {BD:36, SD:38, CH:42, OH:46}; const num = map[row.note];
              if (num) {
                events.push({time:clock, bytes:[0x99,num,vel], priority:2});
                events.push({time:clock + gt, bytes:[0x89,num,0], priority:1});
              }
            } else {
              const num = noteToMidi(row.note);
              events.push({time:clock, bytes:[0x90 + t,num,vel], priority:2});
              events.push({time:clock + gt, bytes:[0x80 + t,num,0], priority:1});
            }
          }
          clock += sanitizeNonNegativeClock(row.st,0);
        });
      }
      events.sort((a,b) => a.time - b.time || a.priority - b.priority || a.bytes[0] - b.bytes[0]);
      const bpm = sanitizeBpm(document.getElementById('bpm-val').value);
      const us = Math.round(60000000 / bpm);
      const track = [0,0xFF,0x51,3,(us>>16)&255,(us>>8)&255,us&255];
      let last = 0;
      events.forEach(ev => { track.push(...toVLQ(ev.time - last), ...ev.bytes); last = ev.time; });
      track.push(0,0xFF,0x2F,0);
      const len = track.length;
      const trkHead = [0x4D,0x54,0x72,0x6B,(len>>24)&255,(len>>16)&255,(len>>8)&255,len&255];
      const blob = new Blob([new Uint8Array([...header,...trkHead,...track])], {type:'audio/midi'});
      const url = URL.createObjectURL(blob); const a = document.createElement('a');
      a.href = url; a.download = `decopo_v072_${Date.now()}.mid`; a.click(); URL.revokeObjectURL(url);
    }

    function buildLegacyGridSnapshot() {
      let maxClock = 32 * ROLL_STEP;
      stgtTracksData.forEach(track => { let c=0; track.forEach(r => c += sanitizeNonNegativeClock(r.st,0)); maxClock = Math.max(maxClock,c); });
      const steps = Math.max(32, Math.ceil(maxClock / ROLL_STEP));
      const synth = Array(16).fill(null).map(() => Object.fromEntries(ALL_NOTES.map(n => [n,Array(steps).fill(false)])));
      const drum = Object.fromEntries(DRUM_TYPES.map(d => [d,Array(steps).fill(false)]));
      for (let t=0;t<16;t++) {
        let clock=0;
        (stgtTracksData[t]||[]).forEach(row => {
          if (row.note && row.note !== 'REST') {
            const step = Math.floor(clock / ROLL_STEP);
            if (TRACKS[t].type === 'drum') { if (drum[row.note]) drum[row.note][step] = true; }
            else if (synth[t][row.note]) synth[t][row.note][step] = true;
          }
          clock += sanitizeNonNegativeClock(row.st,0);
        });
      }
      return {synthTracksData:synth, drumTrackData:drum};
    }
    function saveToFile() {
      const bpm = sanitizeBpm(document.getElementById('bpm-val').value);
      const legacy = buildLegacyGridSnapshot();
      const songData = {
        version:VERSION,
        primaryData:'stgtTracksData',
        bpm,
        stgtTracksData,
        tracksConfig:TRACKS.map(t => t.initPc),
        synthTracksData:legacy.synthTracksData,
        drumTrackData:legacy.drumTrackData
      };
      const blob = new Blob([JSON.stringify(songData,null,2)], {type:'application/json'});
      const url = URL.createObjectURL(blob); const a = document.createElement('a');
      a.href = url; a.download = `decopo_v072_${Date.now()}.json`; a.click(); URL.revokeObjectURL(url);
    }
    function triggerLoad() { document.getElementById('file-loader').click(); }

    function gridTrackHasHits(trackObj) {
      return !!trackObj && Object.values(trackObj).some(arr => Array.isArray(arr) && arr.some(Boolean));
    }
    function drumGridHasHits(drumObj) {
      return !!drumObj && DRUM_TYPES.some(d => Array.isArray(drumObj[d]) && drumObj[d].some(Boolean));
    }
    function legacySynthToStgt(trackObj) {
      if (!trackObj) return [];
      const length = Math.max(0, ...Object.values(trackObj).filter(Array.isArray).map(a=>a.length));
      const rows=[]; let gap=0;
      for (let step=0; step<length; step++) {
        const notes = ALL_NOTES.filter(n => trackObj[n] && trackObj[n][step]);
        if (notes.length) {
          if (gap>0) { rows.push({note:'REST',st:gap*24,gt:0,vel:0,pc:0}); gap=0; }
          notes.forEach((n,i) => rows.push({note:n,st:i===notes.length-1?24:0,gt:18,vel:100,pc:0}));
        } else gap++;
      }
      if (gap>0) rows.push({note:'REST',st:gap*24,gt:0,vel:0,pc:0});
      return rows;
    }
    function legacyDrumToStgt(drumObj) {
      if (!drumObj) return [];
      const length = Math.max(0, ...DRUM_TYPES.map(d => Array.isArray(drumObj[d]) ? drumObj[d].length : 0));
      const rows=[]; let gap=0;
      for (let step=0; step<length; step++) {
        const hits = DRUM_TYPES.filter(d => drumObj[d] && drumObj[d][step]);
        if (hits.length) {
          if (gap>0) { rows.push({note:'REST',st:gap*24,gt:0,vel:0,pc:0}); gap=0; }
          hits.forEach((d,i) => rows.push({note:d,st:i===hits.length-1?24:0,gt:12,vel:100,pc:0}));
        } else gap++;
      }
      if (gap>0) rows.push({note:'REST',st:gap*24,gt:0,vel:0,pc:0});
      return rows;
    }
    function loadFile(event) {
      const file = event.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const song = JSON.parse(e.target.result);
          document.getElementById('bpm-val').value = sanitizeBpm(song.bpm || 120);
          if (Array.isArray(song.tracksConfig)) song.tracksConfig.forEach((pc,i) => { if (TRACKS[i]) TRACKS[i].initPc = TRACKS[i].pc = sanitizePc(pc) || 1; });
          const next = Array(16).fill(null).map(() => []);
          for (let t=0;t<16;t++) {
            const hasStgt = Array.isArray(song.stgtTracksData) && Array.isArray(song.stgtTracksData[t]) && song.stgtTracksData[t].length > 0;
            if (hasStgt) next[t] = song.stgtTracksData[t].map(r => normalizeRow(r,t));
            else if (t === 9 && drumGridHasHits(song.drumTrackData)) next[t] = legacyDrumToStgt(song.drumTrackData).map(r => normalizeRow(r,t));
            else if (Array.isArray(song.synthTracksData) && gridTrackHasHits(song.synthTracksData[t])) next[t] = legacySynthToStgt(song.synthTracksData[t]).map(r => normalizeRow(r,t));
          }
          pushUndo();
          stgtTracksData = next;
          currentEditIdx = null;
          switchTrack(0);
          alert('v0.72 STEP形式へ読み込みました。');
        } catch(err) {
          console.error(err); alert('JSONの読み込みに失敗しました。');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }

    buildPitchButtons();
    buildGmOptions(document.getElementById('gm-pc-select'), false);
    buildGmOptions(document.getElementById('row-pc-select'), true);
    switchTrack(0);
    syncEditorFromForm();
    renderAll();
  </script>
</body>
</html>
